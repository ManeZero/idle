<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "speed": "1x",
  "density": "cozy",
  "animations": true,
  "showGrid": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Pause global animations if disabled
  React.useEffect(() => {
    const id = 'global-anim-toggle';
    let style = document.getElementById(id);
    if (!style) {
      style = document.createElement('style');
      style.id = id;
      document.head.appendChild(style);
    }
    style.textContent = tweaks.animations
      ? ''
      : '*, *::before, *::after { animation: none !important; transition: none !important; }';
  }, [tweaks.animations]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="intro" title="Idle Oil — P&ID Schematic" subtitle="Industrial blueprint direction">
          <DCArtboard id="v5" label="V5 · Схема P&ID (тёмный чертёж)" width={1280} height={820}>
            <V5SchematicTopDown />
          </DCArtboard>
          <DCArtboard id="v5m" label="V5 · Мобильный (390×844)" width={390} height={844}>
            <V5Mobile />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="TWEAKS · IDLE OIL">
        <TweakSection label="Скорость симуляции">
          <TweakRadio
            label="Speed"
            value={tweaks.speed}
            options={[{value:'1x',label:'1×'},{value:'5x',label:'5×'},{value:'50x',label:'50×'}]}
            onChange={(v) => setTweak('speed', v)}
          />
          <TweakRadio
            label="Density"
            value={tweaks.density}
            options={[{value:'compact',label:'Compact'},{value:'cozy',label:'Cozy'}]}
            onChange={(v) => setTweak('density', v)}
          />
        </TweakSection>
        <TweakSection label="Отображение">
          <TweakToggle
            label="Анимации"
            value={tweaks.animations}
            onChange={(v) => setTweak('animations', v)}
          />
          <TweakToggle
            label="Координатная сетка"
            value={tweaks.showGrid}
            onChange={(v) => setTweak('showGrid', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}
