# Сборка игры и деплой статики на GitHub Pages.
# URL после первого успешного запуска: https://manezero.github.io/idle/
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # позволяет запускать руками из вкладки Actions

# Разрешения, требуемые официальными actions/configure-pages и deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Если придёт новый push, пока идёт деплой — отменяем старый
concurrency:
  group: pages
  cancel-in-progress: false

# Принудительно используем Node.js 24 в самих actions — Node 20 устарел
# (см. предупреждение CI про deprecation от GitHub)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включает Pages в репо если ещё не включены
          # (требует pages: write permission, что у нас есть)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
